# binds
unbind %
bind v split-window -h

unbind '"'
bind space split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g default-terminal "screen-256color"

set-window-option -g mode-keys vi
set -g mouse on

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

set-option -g renumber-windows on
set -g automatic-rename on

# theme
set -g status-left-length 50
# default status-right-length is 40, too small once the Claude Code
# segment is populated with a description; without this the date
# and time get truncated off the end of status-right
set -g status-right-length 150

#persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Nix wrappers exec programs by store path (e.g. /nix/store/...-neovim-
# unwrapped-x/bin/nvim), which never matches resurrect's process list, so
# nvim and friends came back as bare shells. Stripping the store prefix lets
# the default list match and relaunches through the wrapped binary on PATH,
# which also survives garbage collection of the saved store path.
set -g @resurrect-hook-post-save-layout 'sed -i "s|\t:/nix/store/[^/]*/bin/\([^\t]*\)$|\t:\1|"'

# Claude Code agent status
#
# Claude Code hooks (see ~/.claude/settings.json) call
# ~/.local/bin/claude-tmux-status.sh to set the @claude_status /
# @claude_desc window options. tmux-claude-inject.sh splices these two
# formats into the loaded theme after it has set its window and status
# formats.
set -g @bornedj_claude_dot "#{?#{==:#{@claude_status},blocked},#[fg=red]● ,#{?#{==:#{@claude_status},working},#[fg=yellow]● ,#{?#{==:#{@claude_status},done},#[fg=green]● ,}}}"
set -g @bornedj_claude_segment "#{?#{==:#{@claude_status},working},#[fg=black]#[bg=yellow] ⚙ #{@claude_desc} ,}#{?#{==:#{@claude_status},blocked},#[fg=black]#[bg=red] ⚠ #{@claude_desc} ,}#{?#{==:#{@claude_status},done},#[fg=black]#[bg=green] ✓ done ,}#[fg=default]#[bg=default]"
